<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />
    <link
      rel="stylesheet"
      href="https://fonts.google.com/specimen/Red+Hat+Display"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <title>Frontend Mentor | Order summary card</title>

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="order_summary">
      <main>
        <img
          class="mainimg"
          src="./images/illustration-hero.svg"
          alt="main image"
        />
        <h1 class="header">Order Summary</h1>
        <section class="story">
          You can now listen to millions of songs, audiobooks, and podcasts on
          any device anywhere you like!
        </section>
        <section class="Plan">
          <div class="pay">
            <img src="./images/icon-music.svg" alt="music_icon" class="music" />
            <div class="prices">
              <b class="ap">Annual Plan</b>
              $59.99/year
            </div>
          </div>
          <div class="change">Change</div>
        </section>

        <div class="buttons">
          <button class="button1">Proceed to Payment</button>
          <button class="button2">Cancel Order</button>
        </div>
      </main>
    </div>
    <footer class="attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
      Coded by <a href="#">Your Name Here</a>.
    </footer>
  </body>
</html>
